[package]
name = "duke"
version.workspace = true
edition.workspace = true
description = "Duke JVM - A JVM implementation in Rust"

[[bin]]
name = "duke"
path = "src/main.rs"

[dependencies]
duke-classfile = { path = "../crates/duke-classfile" }
duke-bytecode = { path = "../crates/duke-bytecode" }
duke-loader = { path = "../crates/duke-loader" }
duke-runtime = { path = "../crates/duke-runtime" }
duke-gc = { path = "../crates/duke-gc" }
duke-interpreter = { path = "../crates/duke-interpreter", features = [] }

[features]
telemetry = ["duke-interpreter/telemetry"]
