[package]
name = "duke-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.duke-loader]
path = ".."

[[bin]]
name = "manifest_parser"
path = "fuzz_targets/manifest_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "directory_loader_fuzz"
path = "fuzz_targets/directory_loader_fuzz.rs"
test = false
doc = false
bench = false

[workspace]
